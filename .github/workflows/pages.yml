name: Deploy webpage to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    defaults:
      run:
        working-directory: web-app
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web-app/package-lock.json
      - name: Install dependencies without Electron lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build static webpage and local WASM assets
        run: npm run build
      - name: Test browser drivers and processing
        run: node --test tests/*.test.mjs
      - name: Verify deployment contains only webpage assets
        run: |
          test -f dist/index.html
          test -f dist/main.js
          test -f dist/vendor/color/lcms.wasm
          test -f dist/vendor/ocr/lang/osd.traineddata.gz
          for excluded in desktop desktop-output node_modules scans pipeline-check.html color-check.html color-ui-check.html shortcuts-check.html; do
            test ! -e "dist/$excluded"
          done
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload only the static webpage
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy webpage
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
